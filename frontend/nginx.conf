gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/xml
  image/svg+xml;

server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  resolver 127.0.0.11 ipv6=off valid=30s;

  root /usr/share/nginx/html;
  index index.html;

  # Allow large uploads (media upload + site-transfer import archives)
  client_max_body_size 512m;

  # security headers (repeated in location blocks that use add_header,
  # because nginx does not inherit server-level add_header into child
  # blocks that define their own add_header directives)
  include /etc/nginx/snippets/csp.conf;

  # hashed Vite assets: long-lived cache
  location /assets/ {
    include /etc/nginx/snippets/csp.conf;
    add_header Cache-Control "public, immutable";
    expires 1y;
    try_files $uri =404;
  }

  # index.html: never cache (try_files fallback lands here via internal redirect)
  location = /index.html {
    include /etc/nginx/snippets/csp.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
  }

  location /api/ {
    set $backend_upstream http://backend:3001;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /media/ {
    set $backend_upstream http://backend:3001;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/news/[^/]+$ {
    set $backend_upstream http://backend:3001;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
