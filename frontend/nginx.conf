gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/xml
  image/svg+xml;

server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  resolver 127.0.0.11 ipv6=off valid=30s;

  root /usr/share/nginx/html;
  index index.html;

  # Allow large uploads (media upload + site-transfer import archives)
  client_max_body_size 512m;

  # security headers (repeated in location blocks that use add_header,
  # because nginx does not inherit server-level add_header into child
  # blocks that define their own add_header directives)
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://resx.octorate.com https://*.octorate.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://resx.octorate.com https://*.octorate.com; img-src 'self' data: blob: https://unpkg.com https://*.tile.openstreetmap.org https://resx.octorate.com https://*.octorate.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://unpkg.com https://resx.octorate.com https://*.octorate.com https://*.tile.openstreetmap.org; frame-src 'self' https://resx.octorate.com https://*.octorate.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

  # hashed Vite assets: long-lived cache
  location /assets/ {
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://resx.octorate.com https://*.octorate.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://resx.octorate.com https://*.octorate.com; img-src 'self' data: blob: https://unpkg.com https://*.tile.openstreetmap.org https://resx.octorate.com https://*.octorate.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://unpkg.com https://resx.octorate.com https://*.octorate.com https://*.tile.openstreetmap.org; frame-src 'self' https://resx.octorate.com https://*.octorate.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control "public, immutable";
    expires 1y;
    try_files $uri =404;
  }

  # index.html: never cache (try_files fallback lands here via internal redirect)
  location = /index.html {
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://resx.octorate.com https://*.octorate.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://resx.octorate.com https://*.octorate.com; img-src 'self' data: blob: https://unpkg.com https://*.tile.openstreetmap.org https://resx.octorate.com https://*.octorate.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://unpkg.com https://resx.octorate.com https://*.octorate.com https://*.tile.openstreetmap.org; frame-src 'self' https://resx.octorate.com https://*.octorate.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
  }

  location /api/ {
    set $backend_upstream http://backend:3001;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /media/ {
    set $backend_upstream http://backend:3001;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/news/[^/]+$ {
    set $backend_upstream http://backend:3001;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
